<!DOCTYPE html>
<html>
  <head>
    <title>IronPulse Gym</title>
    <meta charset="utf-8">
    <link rel="stylesheet" href="css/style.css">
  </head>

  <body>
    <div class="banner">
      <div class="container">
        <h1>Push your limits, transform your body</h1>
        <h2>IronPulse brings modern fitness clubs and expert coaching to your city.</h2>
        <a href="#apply-section" class="btn-blue">Book a free trial</a>
      </div>
    </div>

    <div class="container">
      <h2>Our Fitness Clubs</h2>

      <div class="cards">
        <div class="card">
          <img src="images/paris.jpg" alt="IronPulse Paris">
          <h3>Paris</h3>
        </div>
        <div class="card">
          <img src="images/london.jpg" alt="IronPulse London">
          <h3>London</h3>
        </div>
        <div class="card">
          <img src="images/tokyo.jpg" alt="IronPulse Tokyo">
          <h3>Tokyo</h3>
        </div>
      </div>
    </div>

    <div id="apply-section">
      <iframe
        src="https://form.typeform.com/to/XyErHlvR"
        style="width: 100%; height: 500px; border: none;"
        title="IronPulse Free Trial Form">
      </iframe>
    </div>
  </body>
</html>
